<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Não bộ thứ hai cho Lãnh đạo | ABM Second Brain</title>
<meta name="description" content="Nền tảng ghi chú liên kết kiểu Obsidian chạy ngay trên trình duyệt, không cần cài đặt, bổ sung các tính năng lãnh đạo – doanh nghiệp cần: sổ quyết định, biên bản họp, việc cần làm, mục tiêu, SOP, đóng gói ngữ cảnh cho A.I.">
<meta name="theme-color" content="#030548">
<link rel="manifest" href="/demo/second-brain/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#030548;--navy-2:#0b0f63;--navy-3:#1a1f7a;--gold:#f9b508;--gold-soft:#fff4d6;--red:#d42a2a;
  --bg:#f6f7fb;--panel:#ffffff;--line:#e3e5ef;--ink:#12142b;--ink-2:#474a66;--ink-3:#8a8fa8;--hover:#eef0f7;
  --font-head:"Montserrat",system-ui,sans-serif;--font-body:"Be Vietnam Pro",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;--shadow:0 1px 2px #0305480f,0 8px 24px #03054812;
  --sb-w:272px;--rp-w:300px;--hdr-h:56px;
}
:root[data-theme="dark"]{
  --bg:#0b0d1f;--panel:#12142b;--line:#262a4a;--ink:#eef0fa;--ink-2:#b6bad6;--ink-3:#7c81a3;--hover:#1b1e3d;--gold-soft:#3a2d05;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b0d1f;--panel:#12142b;--line:#262a4a;--ink:#eef0fa;--ink-2:#b6bad6;--ink-3:#7c81a3;--hover:#1b1e3d;--gold-soft:#3a2d05;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy-3);text-decoration:none}
:root[data-theme="dark"] a,.dark a{color:#9ea6ff}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.25;margin:0 0 .4em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-rows:var(--hdr-h) 1fr;height:100%}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:3px solid var(--gold);overflow:hidden;min-width:0}
header.top .brand{display:flex;align-items:center;gap:10px;font:800 15px var(--font-head);letter-spacing:.02em;white-space:nowrap}
header.top .brand img{width:28px;height:28px;border-radius:7px}
header.top .brand small{display:block;font:500 10.5px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:#ffffffb0}
header.top .spacer{flex:1}
.ibtn{background:transparent;border:1px solid #ffffff2e;color:#fff;border-radius:9px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;white-space:nowrap}
.ibtn:hover{background:#ffffff14}
.ibtn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.ibtn.gold:hover{background:#ffc632}
.ibtn svg{width:17px;height:17px}
.ibtn kbd{font:600 10.5px var(--mono);background:#ffffff1f;padding:2px 5px;border-radius:5px}
#burger{display:none}
main.body{display:grid;grid-template-columns:var(--sb-w) 1fr var(--rp-w);min-height:0}
main.body.no-rp{grid-template-columns:var(--sb-w) 1fr}

/* ---------- Sidebar ---------- */
aside.sb{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sb nav{padding:10px 8px 6px}
.sb nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:14px}
.sb nav a svg{width:17px;height:17px;flex:none;opacity:.8}
.sb nav a:hover{background:var(--hover);color:var(--ink)}
.sb nav a.on{background:var(--navy);color:#fff}
.sb nav a .n{margin-left:auto;font-size:11.5px;background:var(--hover);color:var(--ink-2);padding:1px 7px;border-radius:99px;font-weight:600}
.sb nav a.on .n{background:#ffffff26;color:#fff}
.sb nav .grp{font:700 10.5px var(--font-head);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px}
.sb .list{flex:1;overflow:auto;border-top:1px solid var(--line);padding:8px}
.sb .list .hd{display:flex;align-items:center;gap:6px;padding:4px 6px 8px}
.sb .list .hd input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13px;min-width:0}
.ni{display:block;padding:7px 9px;border-radius:8px;color:var(--ink);line-height:1.3}
.ni:hover{background:var(--hover)}
.ni.on{background:var(--gold-soft)}
.ni b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni small{color:var(--ink-3);font-size:11.5px;display:flex;gap:6px;align-items:center}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;color:#fff;letter-spacing:.02em;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.lv-xanh{background:#16a34a}.lv-vang{background:#f9b508}.lv-do{background:#d42a2a}

/* ---------- Main ---------- */
section.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;overflow:auto;padding:22px clamp(14px,3vw,36px) 60px}
.view h1{font-size:clamp(1.3rem,2vw,1.7rem);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.view h1 .sub{font:500 13px var(--font-body);color:var(--ink-3)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;height:36px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.navy:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.btn.danger{color:var(--red)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);height:34px;padding:0 12px;font-size:13px;font-weight:500}
.seg button.on{background:var(--navy);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.tile:hover{border-color:var(--navy-3)}
.tile .k{font:800 26px var(--font-head);color:var(--navy);line-height:1.1}
:root[data-theme="dark"] .tile .k{color:#fff}
.tile .l{color:var(--ink-2);font-size:13px;margin-top:4px}
.tile.warn .k{color:var(--red)}
.card h3{font-size:14.5px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h3 svg{width:18px;height:18px;flex:none;color:var(--navy-3)}
:root[data-theme="dark"] .card h3 svg{color:var(--gold)}
.card h3 .n{margin-left:auto;font-weight:500;color:var(--ink-3);font-size:12px}
.row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t a{color:var(--ink);font-weight:500}
.row .m{color:var(--ink-3);font-size:12px;white-space:nowrap}
.row input[type=checkbox]{margin-top:4px;accent-color:var(--navy);width:16px;height:16px}
.row.done .t{text-decoration:line-through;color:var(--ink-3)}
.row .m.over{color:var(--red);font-weight:600}
.empty{color:var(--ink-3);font-size:13.5px;padding:8px 0}
.bar{height:8px;background:var(--hover);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-3),var(--gold));border-radius:99px}
table.tb{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
table.tb th,table.tb td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tb th{font:700 11.5px var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);background:var(--bg)}
table.tb tr:hover td{background:var(--hover)}
table.tb a{color:var(--ink);font-weight:600}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.tagcloud a{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:500}
.tagcloud a b{color:var(--ink-3);font-weight:500;margin-left:5px}
.notice{background:var(--gold-soft);border:1px solid #f9b50866;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.notice svg{flex:none;width:18px;height:18px;margin-top:2px}

/* ---------- Editor ---------- */
.ed{display:flex;flex-direction:column;height:100%;min-height:0}
.ed .tbar{display:flex;align-items:center;gap:8px;padding:10px clamp(12px,2vw,24px);border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.ed .ttl{flex:1 1 220px;border:0;background:transparent;font:700 clamp(1.1rem,1.8vw,1.45rem) var(--font-head);padding:4px 0;min-width:0;outline:0}
.ed .ttl::placeholder{color:var(--ink-3)}
.ed .panes{flex:1;display:grid;min-height:0;grid-template-columns:1fr}
.ed .panes.split{grid-template-columns:1fr 1fr}
.ed textarea{border:0;resize:none;outline:0;background:var(--panel);padding:20px clamp(14px,2.5vw,32px);font:14.5px/1.7 var(--mono);color:var(--ink);min-height:0;border-right:1px solid var(--line);tab-size:2}
.ed .prev{overflow:auto;padding:20px clamp(14px,2.5vw,32px) 80px;background:var(--panel)}
.ed .panes.m-edit .prev{display:none}
.ed .panes.m-prev textarea{display:none}
.md{max-width:760px;font-size:15.5px}
.md h1{font-size:1.6rem;margin:.6em 0 .4em}.md h2{font-size:1.3rem;margin:1.2em 0 .4em;padding-bottom:4px;border-bottom:1px solid var(--line)}.md h3{font-size:1.1rem;margin:1em 0 .3em}.md h4{font-size:1rem}
.md p{margin:0 0 .9em}
.md ul,.md ol{padding-left:1.4em;margin:0 0 .9em}
.md li{margin:.15em 0}
.md li.task{list-style:none;margin-left:-1.3em;display:flex;gap:8px;align-items:flex-start}
.md li.task input{margin-top:5px;accent-color:var(--navy);width:16px;height:16px;flex:none}
.md li.task.done{color:var(--ink-3);text-decoration:line-through}
.md blockquote{margin:0 0 .9em;padding:6px 16px;border-left:4px solid var(--gold);background:var(--bg);border-radius:0 8px 8px 0;color:var(--ink-2)}
.md code{font:13px var(--mono);background:var(--hover);padding:2px 5px;border-radius:5px}
.md pre{background:#0b0d1f;color:#e9ecff;padding:14px 16px;border-radius:10px;overflow:auto;font:13px/1.55 var(--mono);margin:0 0 1em}
.md pre code{background:transparent;padding:0;color:inherit}
.md table{border-collapse:collapse;margin:0 0 1em;width:100%;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.md th{background:var(--bg)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.md img{max-width:100%;border-radius:8px}
.md mark{background:var(--gold-soft);padding:0 3px}
.md a.wl{color:var(--navy-3);font-weight:600;border-bottom:1px dotted;cursor:pointer}
:root[data-theme="dark"] .md a.wl{color:#9ea6ff}
.md a.wl.new{color:var(--ink-3);border-bottom-style:dashed}
.md a.tag{display:inline-block;background:var(--hover);color:var(--ink-2);border-radius:99px;padding:0 8px;font-size:.88em;font-weight:500;cursor:pointer}
.md .fm{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 16px;font-size:12.5px;color:var(--ink-2);display:grid;grid-template-columns:max-content 1fr;gap:2px 14px}
.md .fm b{font-weight:600;color:var(--ink-3)}

/* ---------- Right panel ---------- */
aside.rp{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 40px;font-size:13.5px}
.rp h4{font:700 11px var(--font-head);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px}
.rp h4:first-child{margin-top:0}
.rp .f{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:6px 8px;margin-bottom:6px}
.rp .f label{color:var(--ink-2);font-size:12.5px}
.rp .f input,.rp .f select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 8px;font-size:13px;width:100%;min-width:0}
.rp .f input[type=range]{padding:0}
.rp ul{list-style:none;margin:0;padding:0}
.rp li{padding:4px 0}
.rp li a{color:var(--ink);font-weight:500;cursor:pointer}
.rp li small{display:block;color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp .ol a{display:block;padding:2px 0;color:var(--ink-2);cursor:pointer}
.rp .ol a.l2{padding-left:12px}.rp .ol a.l3{padding-left:24px;font-size:12.5px}

/* ---------- Graph ---------- */
.gwrap{position:relative;height:calc(100% - 0px);min-height:420px}
canvas#graph{width:100%;height:100%;display:block;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);cursor:grab}
.legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ---------- Palette / modal ---------- */
.ov{position:fixed;inset:0;background:#03054866;backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px;z-index:50}
.ov.show{display:flex}
.pal{width:min(680px,100%);background:var(--panel);border-radius:14px;box-shadow:0 24px 80px #03054866;overflow:hidden;border:1px solid var(--line)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;outline:0;background:transparent}
.pal .res{max-height:52vh;overflow:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer}
.pal .it.on,.pal .it:hover{background:var(--hover)}
.pal .it .k{font:700 10px var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);width:62px;flex:none}
.pal .it b{font-weight:600;font-size:14px}
.pal .it small{color:var(--ink-3);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.modal{width:min(820px,100%);background:var(--panel);border-radius:14px;box-shadow:0 24px 80px #03054866;border:1px solid var(--line);padding:20px 22px;max-height:84vh;overflow:auto}
.modal h2{font-size:1.2rem;display:flex;align-items:center;gap:10px}
.modal h2 .x{margin-left:auto}
.modal h2 svg,.view h1 svg{width:20px;height:20px;flex:none}
.modal textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 var(--mono);background:var(--bg);resize:vertical}
.modal .opts{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0;font-size:13.5px}
.modal .opts label{display:inline-flex;align-items:center;gap:6px}
.modal select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}
.hint{color:var(--ink-3);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--hover);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;color:var(--ink-2)}


.spsel{background:#ffffff14;border:1px solid #ffffff2e;color:#fff;border-radius:9px;height:36px;padding:0 10px;max-width:220px;font-weight:500;font-size:13.5px}
.spsel option{color:var(--ink);background:var(--panel)}
#btnSync.busy svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.f2{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:6px 10px;margin-bottom:8px;font-size:13.5px}
.f2 label{color:var(--ink-2)}.f2 input,.f2 select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13.5px;width:100%;min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:6px 0}
.aibar{display:flex;align-items:center;gap:8px;padding:8px clamp(12px,2vw,24px);background:var(--gold-soft);border-bottom:1px solid var(--line);font-size:13px}
.aibar svg{width:18px;height:18px;flex:none}
.ansbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;max-height:50vh;overflow:auto}
@media (max-width:860px){.spsel{max-width:120px}}

.mapbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.mapbar input{flex:1 1 240px;border:1px solid var(--line);background:var(--panel);border-radius:9px;height:36px;padding:0 12px;min-width:0}
.mapbar select{border:1px solid var(--line);background:var(--panel);border-radius:9px;height:36px;padding:0 10px;max-width:260px}
.mapwrap{position:relative;height:calc(100vh - var(--hdr-h) - 150px);min-height:460px}
.maplegend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 24px)}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.mapstat{position:absolute;left:12px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12px}
.mapcard{position:absolute;right:12px;top:12px;width:min(340px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-up);padding:14px 16px;font-size:13.5px;max-height:calc(100% - 24px);overflow:auto}
.mapcard h3{font-size:15px;margin:6px 0 6px}
.mapcard .mc-h{display:flex;align-items:center;gap:8px}.mapcard .mc-h .x{margin-left:auto}
.mapcard .mc-alert{background:#fde8e8;color:var(--red);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;margin-bottom:8px}
:root[data-theme="dark"] .mapcard .mc-alert{background:#3a1515}
.mapcard .mc-facts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.mapcard .mc-tasks .row{font-size:13px;padding:5px 0}
@media (max-width:860px){.mapwrap{height:calc(100vh - var(--hdr-h) - 210px)}.mapcard{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:55%}.maplegend{display:none}.mapbar .lbl{display:none}}
/* ---------- Responsive ---------- */
@media (max-width:1100px){main.body,main.body.no-rp{grid-template-columns:var(--sb-w) 1fr}aside.rp{position:fixed;right:0;top:var(--hdr-h);bottom:0;width:min(320px,90vw);transform:translateX(100%);transition:.2s;z-index:30;box-shadow:-10px 0 30px #03054822}aside.rp.open{transform:none}}
@media (max-width:860px){
  #burger{display:inline-flex}
  main.body,main.body.no-rp{grid-template-columns:1fr}

<script>
/* =====================================================================
   ABM Second Brain — Não bộ thứ hai cho Lãnh đạo

   Giai đoạn 2: không gian, đồng bộ (GitHub · Google Drive · thư mục máy · máy chủ ABM), đa thiết bị.
   Giai đoạn 3: không gian nhóm & phân quyền (máy chủ cưỡng chế), A.I trực tiếp, Nhân sự số, kiểm toán.
   ===================================================================== */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = (d = new Date()) => { const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const fmtDate = iso => { if (!iso) return ''; const [y,m,d] = String(iso).split('-'); return d && m ? `${d}/${m}/${y}` : iso; };
const fmtDT = ts => { const d = new Date(ts); const z = n => String(n).padStart(2, '0'); return `${fmtDate(todayISO(d))} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const rel = ts => { const s = (Date.now() - ts) / 1000; if (s < 60) return 'vừa xong'; if (s < 3600) return Math.floor(s/60) + ' phút trước'; if (s < 86400) return Math.floor(s/3600) + ' giờ trước'; if (s < 86400*7) return Math.floor(s/86400) + ' ngày trước'; return fmtDate(todayISO(new Date(ts))); };
const daysDiff = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);
const toast = (m, t = 2600) => { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), t); };
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

const TYPES = {
  'ghi-chu':    { label: 'Ghi chú',        color: '#1a1f7a', icon: 'note' },
  'thu-nhan':   { label: 'Thu nhận',       color: '#8a8fa8', icon: 'inbox' },

  'du-an':      { label: 'Dự án',          color: '#ea580c', icon: 'flag' },
  'nhan-su-so': { label: 'Nhân sự số',     color: '#0f766e', icon: 'bot' },
};
const LEVELS = { xanh: 'Xanh — chia sẻ được', vang: 'Vàng — nội bộ', do: 'Đỏ — mật, không đưa vào A.I' };
const STATUS = { 'moi': 'Mới', 'dang-lam': 'Đang làm', 'cho-duyet': 'Chờ duyệt', 'da-chot': 'Đã chốt', 'hoan-thanh': 'Hoàn thành', 'tam-dung': 'Tạm dừng', 'tu-choi': 'Từ chối', 'luu-tru': 'Lưu trữ' };

const KINDS = { local: 'Chỉ máy này', abm: 'Máy chủ ABM (nhóm, phân quyền)', github: 'Kho GitHub (.md, có lịch sử)', gdrive: 'Google Drive (.md)', folder: 'Thư mục trên máy (dùng chung với Obsidian)' };

const ICONS = {
  home:'<path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
  inbox:'<path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 4h14l2 9v7H3v-7Z"/>',

  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="2.5"/><path d="M22 19a5 5 0 0 0-6-4.9"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4Z"/><path d="M20 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8Z"/>',
  flag:'<path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/>',
  graph:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.3 7 15.6 7.6M7.5 8l3.3 8M16.7 9.2l-3.4 6.6"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8Z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  ai:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="4"/>',
  bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M8 2h8"/><circle cx="9" cy="14" r="1.3"/><circle cx="15" cy="14" r="1.3"/><path d="M9 17.5h6"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  dl:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  tpl:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  sync:'<path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 3v6h-6M3 21v-6h6"/>',
  play:'<path d="m7 4 13 8-13 8V4z"/>',
  ok:'<path d="m5 12 5 5L20 7"/>',
  lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  cloud:'<path d="M7 18a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.3 1.5A3.75 3.75 0 0 1 17 18Z"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.note}</svg>`;

/* ---------------- Storage (IndexedDB, fallback localStorage) ---------------- */
const DB = (() => {
  const NAME = 'abm-second-brain', STORE = 'notes', KV = 'kv';
  let db = null, mem = false;
  const open = () => new Promise(res => {
    if (!('indexedDB' in window)) { mem = true; return res(); }
    const rq = indexedDB.open(NAME, 2);
    rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' }); if (!d.objectStoreNames.contains(KV)) d.createObjectStore(KV); };
    rq.onsuccess = () => { db = rq.result; res(); };
    rq.onerror = () => { mem = true; res(); };
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => { const t = db.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); });
  const lsKey = 'abm-sb-notes';
  return {
    open,
    async all() { if (mem) return LS.get(lsKey, []); return tx(STORE, 'readonly', s => s.getAll()); },
    async put(n) { if (mem) { const a = LS.get(lsKey, []); const i = a.findIndex(x => x.id === n.id); i < 0 ? a.push(n) : a[i] = n; LS.set(lsKey, a); return; } return tx(STORE, 'readwrite', s => s.put(n)); },
    async del(id) { if (mem) { LS.set(lsKey, LS.get(lsKey, []).filter(x => x.id !== id)); return; } return tx(STORE, 'readwrite', s => s.delete(id)); },
    async clear() { if (mem) { LS.del(lsKey); return; } return tx(STORE, 'readwrite', s => s.clear()); },
    async kvGet(k) { if (mem) return LS.get('abm-sb-kv-' + k, null); return tx(KV, 'readonly', s => s.get(k)); },
    async kvSet(k, v) { if (mem) { LS.set('abm-sb-kv-' + k, v); return; } return tx(KV, 'readwrite', s => s.put(v, k)); },
    async kvDel(k) { if (mem) { LS.del('abm-sb-kv-' + k); return; } return tx(KV, 'readwrite', s => s.delete(k)); },
  };
})();

/* ---------------- State & Không gian ---------------- */
const S = { all: new Map(), notes: new Map(), cur: null, view: 'home', mode: LS.get('abm-sb-mode', 'split'), sort: 'updated', filter: '', tagFilter: null, listType: null, syncing: false, syncMsg: '' };
const SPACES = {
  list() { const l = LS.get('abm-sb-spaces', null); if (!l || !l.length) { const d = [{ id: 'local', name: 'Máy này', kind: 'local', cfg: {}, redLocal: true }]; LS.set('abm-sb-spaces', d); return d; } return l; },
  save(l) { LS.set('abm-sb-spaces', l); },
  get(id) { return this.list().find(s => s.id === id) || this.list()[0]; },
  cur() { return this.get(LS.get('abm-sb-space', 'local')); },
  update(id, patch) { const l = this.list(); const i = l.findIndex(s => s.id === id); if (i < 0) return; l[i] = { ...l[i], ...patch }; this.save(l); },
  add(sp) { const l = this.list(); l.push(sp); this.save(l); },
  remove(id) { this.save(this.list().filter(s => s.id !== id)); },
};
function spaceNotes(sid) { return [...S.all.values()].filter(n => (n.space || 'local') === sid); }
function loadSpace(id) {
  const sp = SPACES.get(id); LS.set('abm-sb-space', sp.id);
  S.notes = new Map(spaceNotes(sp.id).map(n => [n.id, n])); reindex();
}
function switchSpace(id) { loadSpace(id); S.cur = null; location.hash = '#/view/home'; render(); SYNC.auto(); }

const byTitle = new Map();
function reindex() { byTitle.clear(); for (const n of S.notes.values()) byTitle.set(n.title.trim().toLowerCase(), n.id); }
const findByTitle = t => { const k = String(t).split('/').pop().trim().toLowerCase(); return byTitle.has(k) ? S.notes.get(byTitle.get(k)) : null; };

/* ---------------- Frontmatter & parsing ---------------- */
function parseFm(body) {
  const b = body || '';
  if (!b.startsWith('---\n')) return { fm: {}, content: b, keys: [] };
  const end = b.indexOf('\n---', 4);
  if (end < 0) return { fm: {}, content: b, keys: [] };
  const raw = b.slice(4, end), content = b.slice(end + 4).replace(/^\r?\n/, '');
  const fm = {}, keys = [];
  raw.split('\n').forEach(l => { const m = l.match(/^([\w-]+):\s*(.*)$/); if (m) { fm[m[1]] = m[2].trim().replace(/^["']|["']$/g, ''); keys.push(m[1]); } });
  return { fm, content, keys };
}
function withFm(body, patch) {
  const { fm, content, keys } = parseFm(body);
  const out = { ...fm }; const order = [...keys];
  for (const [k, v] of Object.entries(patch)) { if (v === '' || v == null) { delete out[k]; } else { out[k] = v; if (!order.includes(k)) order.push(k); } }
  const ks = order.filter(k => k in out);
  if (!ks.length) return content;
  return '---\n' + ks.map(k => `${k}: ${out[k]}`).join('\n') + '\n---\n' + content;
}
const noteFm = n => parseFm(n.body).fm;
const noteType = n => { const t = noteFm(n).loai; return TYPES[t] ? t : 'ghi-chu'; };
const noteLevel = n => { const l = noteFm(n).muc_do; return LEVELS[l] ? l : 'xanh'; };
const stripCode = s => s.replace(/```[\s\S]*?```/g, '').replace(/`[^`]*`/g, '');
const TAG_RE = /(^|[\s(])#(?![0-9]+(?=[\s.,;)]|$))([\p{L}\p{N}_\/-]+)/gu;
function noteTags(n) {
  const { fm, content } = parseFm(n.body); const set = new Set();
  (fm.the || '').split(/[,\s]+/).filter(Boolean).forEach(t => set.add(t.replace(/^#/, '')));
  for (const m of stripCode(content).matchAll(TAG_RE)) set.add(m[2]);
  return [...set];
}
function noteLinks(n) { const s = new Set(); for (const m of stripCode(n.body).matchAll(/\[\[([^\]|#]+)/g)) s.add(m[1].trim()); return [...s]; }
function backlinks(id) { const me = S.notes.get(id); if (!me) return []; const out = []; for (const n of S.notes.values()) { if (n.id === id) continue; if (noteLinks(n).some(t => findByTitle(t)?.id === id)) out.push(n); } return out; }
function sections(body) { const out = {}; let cur = null; for (const l of parseFm(body).content.split('\n')) { const m = l.match(/^##\s+(.*)$/); if (m) { cur = m[1].trim().toLowerCase(); out[cur] = ''; } else if (cur) out[cur] += l + '\n'; } for (const k in out) out[k] = out[k].trim(); return out; }
const TASK_RE = /^(\s*)[-*+]\s+\[([ xX])\]\s+(.*)$/;
function allTasks() {
  const out = [];
  for (const n of S.notes.values()) {
    const lines = n.body.split('\n'); let inCode = false;
    lines.forEach((l, i) => {
      if (/^```/.test(l)) { inCode = !inCode; return; } if (inCode) return;
      const m = l.match(TASK_RE); if (!m) return;
      let text = m[3]; const done = m[2] !== ' ';
      const due = (text.match(/📅\s*(\d{4}-\d{2}-\d{2})/) || text.match(/\(hạn:?\s*(\d{4}-\d{2}-\d{2})\)/))?.[1] || '';
      const owner = text.match(/@([\p{L}\p{N}_.-]+)/u)?.[1] || '';
      text = text.replace(/📅\s*\d{4}-\d{2}-\d{2}/, '').replace(/\(hạn:?\s*\d{4}-\d{2}-\d{2}\)/, '').trim();
      out.push({ noteId: n.id, note: n, line: i, text, done, due, owner });
    });
  }
  return out;
}
async function toggleTask(noteId, line) {
  const n = S.notes.get(noteId); if (!n) return;
  const lines = n.body.split('\n'); const l = lines[line]; if (!l) return;
  lines[line] = /\[ \]/.test(l) ? l.replace('[ ]', '[x]') : l.replace(/\[[xX]\]/, '[ ]');
  n.body = lines.join('\n'); n.updated = Date.now(); await DB.put(n); render();
}
const excerpt = (n, len = 90) => parseFm(n.body).content.replace(/^#+\s.*$/mg, '').replace(/^>\s*\[A\.I.*$/mg, '').replace(/[*_`>#\[\]]/g, '').replace(/\s+/g, ' ').trim().slice(0, len);

/* ---------------- Markdown renderer ---------------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`);
  s = s.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (m, t, a) => `<a class="wl${findByTitle(t) ? '' : ' new'}" data-wl="${t.trim()}">${a || t}</a>`);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/==([^=]+)==/g, '<mark>$1</mark>');
  s = s.replace(TAG_RE, (m, p, t) => `${p}<a class="tag" data-tag="${t}">#${t}</a>`);

function renderMd(body, opts = {}) {
  const { fm, content, keys } = parseFm(body);
  const lines = content.split('\n'); const out = []; let i = 0;
  const offset = body.length - content.length; const baseLine = body.slice(0, offset).split('\n').length - 1;
  if (keys.length && opts.showFm !== false) out.push('<div class="fm">' + keys.map(k => `<b>${esc(k)}</b><span>${inline(fm[k])}</span>`).join('') + '</div>');
  const para = []; const flushP = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para.length = 0; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { flushP(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flushP(); const lv = m[1].length; out.push(`<h${lv} id="h-${i}">${inline(m[2])}</h${lv}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { flushP(); out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(l)) { flushP(); const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, '')); out.push('<blockquote>' + renderMd(buf.join('\n'), { showFm: false }) + '</blockquote>'); continue; }

      flushP(); const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      const head = cells(rows[0]); const bodyRows = rows.slice(2).map(cells);
      out.push('<table><thead><tr>' + head.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' + bodyRows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    if ((m = l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
      flushP(); const items = [];
      while (i < lines.length && (m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) { items.push({ indent: m[1].replace(/\t/g, '  ').length, type: /\d/.test(m[2]) ? 'ol' : 'ul', text: m[3], line: i }); i++; }
      let html = ''; const stack = [];
      for (const it of items) {
        while (stack.length && it.indent < stack[stack.length - 1].indent) html += '</li></' + stack.pop().type + '>';
        if (!stack.length || it.indent > stack[stack.length - 1].indent) { stack.push({ indent: it.indent, type: it.type }); html += '<' + it.type + '>'; } else html += '</li>';
        const tm = it.text.match(/^\[([ xX])\]\s+(.*)$/);
        if (tm) { const done = tm[1] !== ' '; html += `<li class="task${done ? ' done' : ''}"><input type="checkbox" data-line="${it.line + baseLine}"${done ? ' checked' : ''}><span>${inline(tm[2])}</span>`; }
        else html += '<li>' + inline(it.text);
      }
      while (stack.length) html += '</li></' + stack.pop().type + '>';
      out.push(html); continue;
    }
    if (!l.trim()) { flushP(); i++; continue; }
    para.push(l); i++;

}

function viewTasks() {

  for (const sc of scopes) {
    if (sc === 'ban-do' && ids) ids.forEach(id => add(S.notes.get(id), 'trên bản đồ'));
    else if (sc === 'ghi-chu-hien-tai' && cur) add(cur, 'ghi chú chính');
    else if (sc === 'lien-ket' && cur) noteLinks(cur).forEach(t => add(findByTitle(t), 'được liên kết'));
    else if (sc === 'lien-ket-nguoc' && cur) backlinks(cur.id).forEach(n => add(n, 'trỏ tới ghi chú chính'));
    else if (sc === 'muc-tieu') notes.filter(n => noteType(n) === 'muc-tieu' && noteFm(n).trang_thai !== 'hoan-thanh').forEach(n => add(n, 'mục tiêu'));
    else if (sc === 'quyet-dinh') recent('quyet-dinh', 30).forEach(n => add(n, 'quyết định'));
    else if (sc === 'hop') recent('hop', 14).forEach(n => add(n, 'biên bản họp'));
    else if (sc === 'nhat-ky') recent('nhat-ky', 7).forEach(n => add(n, 'nhật ký'));
    else if (sc === 'du-an') notes.filter(n => noteType(n) === 'du-an' && noteFm(n).trang_thai !== 'hoan-thanh').forEach(n => add(n, 'dự án'));
    else if (sc === 'sop') notes.filter(n => noteType(n) === 'sop').forEach(n => add(n, 'SOP'));

    if (!n) { const text = await P.read(r); const title = r.path.replace(/\.md$/i, '').split('/').pop(); const c = await createNote({ title, body: text, open: false, path: r.path.replace(/\.md$/i, ''), space: sp.id }); c.sync = { path: r.path, rev: r.rev, id: r.id }; c.syncedAt = c.updated; await DB.put(c); pulled++; }

    }
  }
  for (const n of notes) { if (n.sync?.path && !byPath.has(n.sync.path) && n.updated <= (n.syncedAt || 0)) { await removeNote(n.id, { silent: true }); removed++; } }

  for (const n of spaceNotes(sp.id)) {
    if (sp.redLocal && noteLevel(n) === 'do') continue;
    if (n.sync?.path && n.updated <= (n.syncedAt || 0)) continue;
    const path = n.sync?.path || uniquePath(n, used); const res = await P.write(path, n.body, n.sync); n.sync = { path, rev: res.rev, id: res.id }; n.syncedAt = n.updated; await DB.put(n); pushed++;
  }

}

    if (!n) { const c = await createNote({ id: r.id, title: r.title, body: r.body, path: r.path, open: false, space: sp.id }); c.created = r.created; c.updated = r.updated; c.syncedAt = r.updated; c.serverUpdated = r.updated; await DB.put(c); pulled++; }

    else { n.title = r.title; n.body = r.body; n.path = r.path; n.updated = r.updated; n.syncedAt = r.updated; n.serverUpdated = r.updated; await DB.put(n); pulled++; }
  }

    const res = await ACCOUNT.api('POST', 'notes', { space: sid, notes: [...dirty.map(n => ({ id: n.id, title: n.title, body: n.body, path: n.path || '', created: n.created, updated: n.updated, base: n.serverUpdated || 0 })), ...tombs] });

    for (const c of res.conflicts) { const n = S.all.get(c.id); if (!n) continue; if (c.deleted) { n.serverUpdated = c.updated; } else { await conflictCopy(n, c.body, 'máy chủ'); n.serverUpdated = c.updated; } await DB.put(n); conflicts++; }
    if (res.rejected?.length) toast(`${res.rejected.length} ghi chú bị máy chủ từ chối (không đủ quyền)`, 5000);
    if (conflicts) { // đẩy lại bản cục bộ với mốc mới: bản của Sếp thắng, bản máy chủ đã được giữ thành bản sao
      const again = dirty.filter(n => res.conflicts.some(c => c.id === n.id && !c.deleted)); if (again.length) { const r2 = await ACCOUNT.api('POST', 'notes', { space: sid, notes: again.map(n => ({ id: n.id, title: n.title, body: n.body, path: n.path || '', created: n.created, updated: n.updated, base: n.serverUpdated })) }); for (const id of r2.accepted) { const n = S.all.get(id); n.syncedAt = n.updated; n.serverUpdated = n.updated; await DB.put(n); pushed++; } }
    }

  }

}

/* ---------------- Events ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-cmd],[data-go],[data-wl],[data-tag],[data-mode],[data-retype],[data-del],[data-hd],[data-run],[data-approve],[data-reject],.it');
  if (!t) return;
  if (t.dataset.cmd) { e.preventDefault(); runCmd(t.dataset.cmd); }
  else if (t.dataset.go) location.hash = t.dataset.go;
  else if (t.dataset.wl != null) { e.preventDefault(); openByTitle(t.dataset.wl); }
  else if (t.dataset.tag) { e.preventDefault(); location.hash = '#/tag/' + encodeURIComponent(t.dataset.tag); }
  else if (t.dataset.mode) setMode(t.dataset.mode);
  else if (t.dataset.retype) { const [id, ty] = t.dataset.retype.split(':'); retype(id, ty); }
  else if (t.dataset.del) deleteNote(t.dataset.del);
  else if (t.dataset.run) runAgent(t.dataset.run);
  else if (t.dataset.approve) approveNote(t.dataset.approve, true);
  else if (t.dataset.reject) approveNote(t.dataset.reject, false);
  else if (t.dataset.hd) { const h = $$('#prev h1,#prev h2,#prev h3').find(x => x.textContent === t.dataset.hd); h?.scrollIntoView({ behavior: 'smooth', block: 'start' }); if (S.mode === 'edit') setMode('split'); }
  else if (t.classList.contains('it')) palRun(+t.dataset.i);
});
document.addEventListener('change', e => {
  const cb = e.target; if (cb.matches('input[data-task]')) { const [id, line] = cb.dataset.task.split(':'); toggleTask(id, +line); }
  if (cb.matches('#prev input[type=checkbox][data-line]')) { const n = S.notes.get(S.cur); toggleTask(n.id, +cb.dataset.line).then(() => { const ta = $('#ta'); if (ta) ta.value = n.body; }); }
});
async function runCmd(c) {
  const sp = curSpace();
  const guard = async (fn) => { try { await fn(); } catch (err) { toast(err.message, 6000); } };
  if (c === 'new') return createNote();
  if (c.startsWith('new:')) return newFromTemplate(c.slice(4));
  if (c === 'capture') return quickCapture();
  if (c === 'ai') return aiPack();
  if (c === 'aiMap') return aiPack({ ids: mapVisibleIds() });
  if (c === 'tplMenu') return tplMenu();
  if (c === 'exportMd') return exportMd();
  if (c === 'exportZip') return exportZip();
  if (c === 'exportJson') return exportJson();
  if (c === 'importDir') return $('#fileDir').click();
  if (c === 'importMd') return $('#fileMd').click();
  if (c === 'importJson') return $('#fileJson').click();
  if (c === 'del') return deleteNote(S.cur);
  if (c === 'wipe') return wipe();
  if (c === 'seed') return seed(true).then(() => { render(); toast('Đã nạp dữ liệu mẫu'); });
  if (c === 'addSpace') return addSpaceModal();
  if (c === 'saveSpace') { const patch = { name: $('#spName').value.trim() || sp.name }; if ($('#spRed')) patch.redLocal = $('#spRed').checked; if ($('#spAuto')) patch.auto = $('#spAuto').checked;
    if (sp.kind === 'github') patch.cfg = { ...sp.cfg, repo: $('#ghRepo').value.trim(), branch: $('#ghBranch').value.trim() || 'main', dir: $('#ghDir').value.trim(), token: $('#ghToken').value.trim() };
    if (sp.kind === 'gdrive') patch.cfg = { ...sp.cfg, clientId: $('#gdClient').value.trim() };
    SPACES.update(sp.id, patch); toast('Đã lưu'); render(); SYNC.auto(); return; }
  if (c === 'syncNow') return SYNC.run(true);
  if (c === 'removeSpace') { if (!confirm(`Gỡ không gian "${sp.name}" khỏi máy này? Ghi chú chưa đồng bộ sẽ mất; dữ liệu ở nơi lưu từ xa vẫn còn.`)) return; for (const n of spaceNotes(sp.id)) { S.all.delete(n.id); await DB.del(n.id); } await DB.kvDel('dir:' + sp.id); SPACES.remove(sp.id); loadSpace('local'); location.hash = '#/view/home'; render(); return; }
  if (c === 'pickFolder') return guard(async () => { if (!window.showDirectoryPicker) throw new Error('Trình duyệt này không hỗ trợ (dùng Chrome / Edge trên máy tính)'); const h = await showDirectoryPicker({ mode: 'readwrite' }); await DB.kvSet('dir:' + sp.id, h); SPACES.update(sp.id, { cfg: { ...sp.cfg, folderName: h.name } }); render(); toast('Đã chọn thư mục ' + h.name); });
  if (c === 'members') return membersModal();
  if (c === 'auditSrv') return auditModal();
  if (c === 'login') return guard(async () => { await ACCOUNT.login($('#acUrl').value.trim(), $('#acEmail').value.trim(), $('#acPw').value); toast('Đã đăng nhập'); render(); });
  if (c === 'register') { if ($('#regExtra').hidden) { $('#regExtra').hidden = false; $('#regExtra2').hidden = false; $('#acName').focus(); return; } return guard(async () => { await ACCOUNT.register($('#acUrl').value.trim(), $('#acEmail').value.trim(), $('#acPw').value, $('#acName').value.trim(), $('#acInvite').value.trim()); toast('Đã tạo tài khoản'); render(); }); }
  if (c === 'logout') return guard(async () => { await ACCOUNT.logout(); render(); });
  if (c === 'refreshAcct') return guard(async () => { await ACCOUNT.refresh(); render(); toast('Đã cập nhật'); });
  if (c === 'newTeam') return guard(async () => { const name = prompt('Tên không gian nhóm:'); if (!name) return; const r = await ACCOUNT.api('POST', 'spaces', { name }); await ACCOUNT.refresh(); switchSpace('abm-' + r.space.id); toast('Đã tạo không gian nhóm'); });
  if (c === 'saveAI') { AI.set({ provider: $('#aiProv').value, key: $('#aiKey').value.trim(), model: $('#aiModel').value.trim() }); toast('Đã lưu cấu hình A.I'); return; }
  if (c === 'testAI') return guard(async () => { AI.set({ provider: $('#aiProv').value, key: $('#aiKey').value.trim(), model: $('#aiModel').value.trim() }); toast('Đang gọi thử…'); const t = await callAI({ prompt: 'Trả lời đúng một câu: "A.I đã kết nối với Não bộ thứ hai của ABM."' }); toast('A.I trả lời: ' + t.slice(0, 120), 6000); });
}
$('#fileDir').addEventListener('change', e => importFiles(e.target.files));
$('#fileMd').addEventListener('change', e => importFiles(e.target.files));
$('#fileJson').addEventListener('change', e => e.target.files[0] && importJson(e.target.files[0]));
$('#btnNew').addEventListener('click', () => createNote());
$('#btnCapture').addEventListener('click', () => quickCapture());
$('#btnSearch').addEventListener('click', () => openPal());
$('#btnTheme').addEventListener('click', toggleTheme);
$('#btnSync').addEventListener('click', () => SYNC.run(true));
$('#btnRp').addEventListener('click', () => { if (S.view !== 'note') return toast('Mở một ghi chú để xem thuộc tính & liên kết'); $('#rp').classList.toggle('open'); });
$('#burger').addEventListener('click', () => $('#sb').classList.toggle('open'));
$('#spaceSel').addEventListener('change', e => { if (e.target.value === '__new') { renderHeader(); addSpaceModal(); } else switchSpace(e.target.value); });
$('#filter').addEventListener('input', e => { S.filter = e.target.value; renderList(); });
$('#sortBtn').addEventListener('click', () => { S.sort = S.sort === 'title' ? 'updated' : 'title'; renderList(); });
$('#palIn').addEventListener('input', palSearch);
$('#palIn').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); PAL.idx = (PAL.idx + (e.key === 'ArrowDown' ? 1 : -1) + PAL.items.length) % PAL.items.length; $$('#palRes .it').forEach((el, i) => el.classList.toggle('on', i === PAL.idx)); $$('#palRes .it')[PAL.idx]?.scrollIntoView({ block: 'nearest' }); }
  if (e.key === 'Enter') palRun(PAL.idx);
  if (e.key === 'Escape') closePal();
});
$('#palOv').addEventListener('click', e => { if (e.target === e.currentTarget) closePal(); });
$('#modOv').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); }
  else if (mod && e.key.toLowerCase() === 'n' && !e.shiftKey) { e.preventDefault(); createNote(); }
  else if (mod && e.key.toLowerCase() === 'e' && S.view === 'note') { e.preventDefault(); setMode(S.mode === 'edit' ? 'prev' : S.mode === 'prev' ? 'split' : 'edit'); }
  else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); const n = S.cur && S.notes.get(S.cur); if (n) { clearTimeout(saveT); DB.put(n).then(() => toast('Đã lưu')); } }
  else if (e.key === 'Escape') { closePal(); closeModal(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && curSpace().kind !== 'local' && curSpace().auto !== false) SYNC.run(false); });
function backupNudge() { const sp = curSpace(); if (sp.kind !== 'local') return; const last = +LS.get('abm-sb-lastExport', 0); if (S.notes.size > 15 && Date.now() - last > 7 * 86400000) setTimeout(() => toast('Gợi ý: không gian này chỉ ở máy này — thêm không gian đồng bộ hoặc xuất .zip (đã hơn 7 ngày).', 6000), 4000); }

/* ---------------- Init ---------------- */
(async () => {
  await DB.open();
  for (const n of await DB.all()) { if (!n.space) { n.space = 'local'; await DB.put(n); } S.all.set(n.id, n); }
  loadSpace(SPACES.cur().id); await seed();
  route(); backupNudge(); SYNC.auto();
  if (ACCOUNT.get()) ACCOUNT.refresh().then(() => renderHeader()).catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/demo/second-brain/sw.js').catch(() => {});
})();

</script>
