<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vault .md trên web | ABM</title>
<meta name="description" content="Mở một thư mục ghi chú .md (vault Obsidian) ngay trên trình duyệt: đọc, liên kết hai chiều [[ ]], sơ đồ liên kết động, tìm kiếm, thẻ. Không cần cài đặt.">
<meta name="theme-color" content="#030548">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{--navy:#030548;--navy-3:#1a1f7a;--gold:#f9b508;--gold-soft:#fff4d6;--red:#d42a2a;--bg:#f6f7fb;--panel:#fff;--line:#e3e5ef;--ink:#12142b;--ink-2:#474a66;--ink-3:#8a8fa8;--hover:#eef0f7;--font-head:"Montserrat",system-ui,sans-serif;--font-body:"Be Vietnam Pro",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--hdr:52px;--sb:280px;--rp:280px}
:root[data-theme="dark"]{--bg:#0b0d1f;--panel:#12142b;--line:#262a4a;--ink:#eef0fa;--ink-2:#b6bad6;--ink-3:#7c81a3;--hover:#1b1e3d;--gold-soft:#3a2d05}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d1f;--panel:#12142b;--line:#262a4a;--ink:#eef0fa;--ink-2:#b6bad6;--ink-3:#7c81a3;--hover:#1b1e3d;--gold-soft:#3a2d05}}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--navy-3);text-decoration:none}:root[data-theme="dark"] a{color:#9ea6ff}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.25;margin:0 0 .4em}
#app{display:grid;grid-template-rows:var(--hdr) 1fr;height:100%}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:3px solid var(--gold);overflow:hidden}
header .brand{display:flex;align-items:center;gap:9px;font:800 14px var(--font-head);white-space:nowrap;color:#fff}
header .brand img{width:26px;height:26px;border-radius:6px}header .brand small{display:block;font:500 10px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:#ffffffb0}
header .sp{flex:1}
.ib{background:transparent;border:1px solid #ffffff2e;color:#fff;border-radius:8px;height:34px;padding:0 11px;display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13px;white-space:nowrap}
.ib:hover{background:#ffffff14}.ib.gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}.ib.on{background:#ffffff26}.ib svg{width:16px;height:16px}.ib kbd{font:600 10px var(--mono);background:#ffffff1f;padding:2px 5px;border-radius:4px}
#burger{display:none}
main{display:grid;grid-template-columns:var(--sb) 1fr var(--rp);grid-template-rows:minmax(0,1fr);min-height:0;height:calc(100vh - var(--hdr));height:calc(100dvh - var(--hdr))}main.nrp{grid-template-columns:var(--sb) 1fr}main.nrp aside.rp{display:none}
aside.sb{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sb .top{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sb .vault{font:700 13px var(--font-head);display:flex;align-items:center;gap:8px;overflow:hidden}.sb .vault span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb .vault small{color:var(--ink-3);font-weight:500;font-family:var(--font-body);flex:none}
.sb .row{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;height:32px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:13px;white-space:nowrap}.btn:hover{background:var(--hover)}.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.sm{height:28px;padding:0 9px;font-size:12px}.btn svg{width:15px;height:15px}.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sb input.f{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13px}
.tree{flex:1;overflow:auto;padding:6px 6px 30px;font-size:13.5px}
.tree .d{color:var(--ink-2);font-weight:600;padding:4px 6px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none}.tree .d:hover{background:var(--hover)}.tree .d svg{width:13px;height:13px;transition:.15s}.tree .d.c svg{transform:rotate(-90deg)}
.tree .kids{margin-left:12px;border-left:1px solid var(--line);padding-left:4px}.tree .d.c+.kids{display:none}
.tree a.fi{display:block;padding:4px 7px;border-radius:6px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree a.fi:hover{background:var(--hover)}.tree a.fi.on{background:var(--gold-soft);font-weight:600}
section.mn{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.nbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.nbar .path{flex:1;min-width:0;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc{flex:1;overflow:auto;padding:22px clamp(16px,4vw,48px) 80px;background:var(--panel)}
.doc .md{max-width:780px;margin:0 auto}.doc h1.t{font-size:1.75rem;margin-bottom:.5em}
.ed{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}.ed.one{grid-template-columns:1fr}
.ed textarea{border:0;resize:none;outline:0;background:var(--panel);padding:20px 24px;font:14px/1.7 var(--mono);color:var(--ink);border-right:1px solid var(--line)}
.ed .doc{padding:20px 24px 80px}
.md{font-size:15.5px}.md h1{font-size:1.6rem;margin:.6em 0 .4em}.md h2{font-size:1.3rem;margin:1.2em 0 .4em;padding-bottom:4px;border-bottom:1px solid var(--line)}.md h3{font-size:1.1rem;margin:1em 0 .3em}.md p{margin:0 0 .9em}.md ul,.md ol{padding-left:1.4em;margin:0 0 .9em}.md li{margin:.15em 0}.md li.task{list-style:none;margin-left:-1.3em}.md li.task input{accent-color:var(--navy);margin-right:6px}.md li.task.done{color:var(--ink-3);text-decoration:line-through}
.md blockquote{margin:0 0 .9em;padding:6px 16px;border-left:4px solid var(--gold);background:var(--bg);border-radius:0 8px 8px 0;color:var(--ink-2)}.md code{font:13px var(--mono);background:var(--hover);padding:2px 5px;border-radius:5px}.md pre{background:#0b0d1f;color:#e9ecff;padding:14px 16px;border-radius:10px;overflow:auto;font:13px/1.55 var(--mono);margin:0 0 1em}.md pre code{background:transparent;padding:0;color:inherit}
.md table{border-collapse:collapse;margin:0 0 1em;width:100%;font-size:14px}.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}.md th{background:var(--bg)}.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}.md img{max-width:100%;border-radius:8px}.md mark{background:var(--gold-soft);padding:0 3px}
.md a.wl{color:var(--navy-3);font-weight:600;border-bottom:1px dotted;cursor:pointer}:root[data-theme="dark"] .md a.wl{color:#9ea6ff}.md a.wl.new{color:var(--ink-3);border-bottom-style:dashed}
.md a.tag{display:inline-block;background:var(--hover);color:var(--ink-2);border-radius:99px;padding:0 8px;font-size:.88em;font-weight:500;cursor:pointer}
.md .fm{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 16px;font-size:12.5px;color:var(--ink-2);display:grid;grid-template-columns:max-content 1fr;gap:2px 14px}.md .fm b{font-weight:600;color:var(--ink-3)}
.md .embed{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:8px 14px;margin:0 0 1em;background:var(--bg)}.md .embed .eh{font:700 12px var(--font-head);color:var(--ink-3);margin-bottom:4px}
aside.rp{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 14px 40px;font-size:13.5px}
.rp h4{font:700 11px var(--font-head);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px}.rp h4:first-child{margin-top:0}.rp h4 .n{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.rp ul{list-style:none;margin:0;padding:0}.rp li{padding:4px 0}.rp li a{color:var(--ink);font-weight:500;cursor:pointer}.rp li small{display:block;color:var(--ink-3);font-size:11.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rp .ol a{display:block;padding:2px 0;color:var(--ink-2);cursor:pointer}.rp .ol a.l2{padding-left:12px}.rp .ol a.l3{padding-left:24px;font-size:12.5px}
.rp .lg{height:220px;border:1px solid var(--line);border-radius:10px;background:var(--bg);position:relative}.rp .lg canvas{width:100%;height:100%;display:block;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--hover);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;color:var(--ink-2)}
.hint{color:var(--ink-3);font-size:12.5px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}.empty .in{max-width:560px}.empty h2{font-size:1.4rem}.empty .drop{border:2px dashed var(--line);border-radius:16px;padding:28px;margin:18px 0;background:var(--panel);transition:.2s}.empty .drop.over{border-color:var(--gold);background:var(--gold-soft)}
.gv{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column}
.gbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13px}
.gbar input[type=search]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;width:220px;max-width:40vw}.gbar label{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}.gbar input[type=range]{width:90px;accent-color:var(--navy)}
.gwrap{flex:1;position:relative}.gwrap canvas{width:100%;height:100%;display:block;cursor:grab}
.gstat{position:absolute;left:12px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-2)}
.ov{position:fixed;inset:0;background:#03054866;backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px;z-index:50}.ov.show{display:flex}
.pal{width:min(640px,100%);background:var(--panel);border-radius:14px;box-shadow:0 24px 80px #03054866;overflow:hidden;border:1px solid var(--line)}.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:15px 18px;font-size:16px;outline:0;background:transparent}.pal .res{max-height:52vh;overflow:auto;padding:6px}.pal .it{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer}.pal .it.on,.pal .it:hover{background:var(--hover)}.pal .it b{font-weight:600;font-size:14px}.pal .it small{color:var(--ink-3);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:9px 15px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:1100px){main,main.nrp{grid-template-columns:var(--sb) 1fr}main.nrp aside.rp{display:none}aside.rp{position:fixed;right:0;top:var(--hdr);bottom:0;width:min(320px,90vw);transform:translateX(100%);transition:.2s;z-index:30;box-shadow:-10px 0 30px #03054822}aside.rp.open{transform:none}}
@media (max-width:860px){#burger{display:inline-flex}main,main.nrp{grid-template-columns:1fr}aside.sb{position:fixed;left:0;top:var(--hdr);bottom:0;width:min(300px,86vw);transform:translateX(-100%);transition:.2s;z-index:30;box-shadow:10px 0 30px #03054822}aside.sb.open{transform:none}header .brand small,.ib .lbl,.ib kbd{display:none}.ed{grid-template-columns:1fr}.ed textarea{display:none}.ed.edit textarea{display:block}.ed.edit .doc{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <button id="burger" class="ib" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="/demo/"><img src="/brand/icon-512.png" alt="ABM"><span>Vault .md<small>Xem Obsidian trên web · ABM</small></span></a>
  <span class="sp"></span>
  <button class="ib" id="bSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Tìm</span><kbd>Ctrl K</kbd></button>
  <button class="ib" id="bGraph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.3 7 15.6 7.6M7.5 8l3.3 8M16.7 9.2l-3.4 6.6"/></svg><span class="lbl">Sơ đồ liên kết</span></button>
  <button class="ib" id="bTheme" title="Sáng / tối"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
  <button class="ib" id="bRp" title="Liên kết ngược & dàn ý"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
</header>
<main id="main" class="nrp">
  <aside class="sb" id="sb">
    <div class="top">
      <div class="vault" id="vaultName"><span>Chưa mở vault</span></div>
      <div class="row"><button class="btn navy" id="bOpen" title="Chọn thư mục chứa file .md"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg> Mở thư mục</button><button class="btn" id="bSample">Vault mẫu</button><button class="btn" id="bNew" title="Ghi chú mới" hidden>+</button></div>
      <input class="f" id="filter" placeholder="Lọc file…">
    </div>
    <div class="tree" id="tree"></div>
  </aside>
  <section class="mn" id="mn"></section>
  <aside class="rp" id="rp"></aside>
</main>
</div>
<div class="ov" id="palOv"><div class="pal"><input id="palIn" placeholder="Tìm ghi chú theo tên hoặc nội dung…" autocomplete="off"><div class="res" id="palRes"></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileDir" webkitdirectory directory multiple hidden><input type="file" id="fileMd" multiple accept=".md,.markdown,.txt,.png,.jpg,.jpeg,.gif,.webp,.svg" hidden>
<script>
'use strict';
/* ABM Vault .md — trình xem vault Obsidian trên web. Không máy chủ, không tài khoản. */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (m, t = 2400) => { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), t); };
const V = { name: '', files: new Map(), assets: new Map(), cur: null, dirHandle: null, writable: false, view: 'note', mode: 'read', dirty: false, filter: '' };
// files: path -> { path, name (basename không .md), dir, body, handle? }

/* ---------- Đọc vault ---------- */
const isMd = n => /\.(md|markdown|txt)$/i.test(n), isImg = n => /\.(png|jpe?g|gif|webp|svg)$/i.test(n);
function addFile(path, body, handle) { const name = path.split('/').pop().replace(/\.(md|markdown|txt)$/i, ''); V.files.set(path, { path, name, dir: path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '', body, handle }); }
async function loadFromFileList(list) {
  V.files.clear(); V.assets.clear(); let root = '';
  for (const f of list) { const rel = f.webkitRelativePath || f.name; const parts = rel.split('/'); if (parts.length > 1 && !root) root = parts[0]; const path = parts.length > 1 ? parts.slice(1).join('/') : rel; if (path.split('/').some(p => p.startsWith('.'))) continue; if (isMd(f.name)) addFile(path, await f.text()); else if (isImg(f.name)) V.assets.set(path, URL.createObjectURL(f)); }
  V.name = root || 'Vault'; V.writable = false; V.dirHandle = null; finishLoad();
}
async function loadFromHandle(h) {
  V.files.clear(); V.assets.clear(); V.dirHandle = h; V.name = h.name; V.writable = true;
  const walk = async (dir, pre) => { for await (const [n, e] of dir.entries()) { if (n.startsWith('.')) continue; if (e.kind === 'directory') await walk(e, pre + n + '/'); else if (isMd(n)) addFile(pre + n, await (await e.getFile()).text(), e); else if (isImg(n)) V.assets.set(pre + n, URL.createObjectURL(await e.getFile())); } };
  await walk(h, ''); finishLoad();
}
function finishLoad() { index(); V.cur = null; V.view = 'note'; const first = [...V.files.values()].find(f => /^(readme|index|home|start|bắt đầu|00)/i.test(f.name)) || [...V.files.values()][0]; render(); if (first) open(first.path); toast(`Đã mở "${V.name}": ${V.files.size} ghi chú`); $('#bNew').hidden = !V.writable; }
async function pickDir() {
  if (window.showDirectoryPicker) { try { const h = await showDirectoryPicker({ mode: 'readwrite' }); await loadFromHandle(h); try { await DBH.set('last', h); } catch {} return; } catch (e) { if (e.name === 'AbortError') return; } }
  $('#fileDir').click();
}
const DBH = (() => { const o = () => new Promise(r => { const q = indexedDB.open('abm-vault', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); return { async get(k) { const d = await o(); if (!d) return null; return new Promise(r => { const t = d.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => r(t.result); t.onerror = () => r(null); }); }, async set(k, v) { const d = await o(); if (!d) return; d.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } }; })();
async function reopenLast() { try { const h = await DBH.get('last'); if (!h) return false; if (await h.queryPermission({ mode: 'readwrite' }) !== 'granted') { $('#vaultName').innerHTML = `<span>${esc(h.name)}</span><button class="btn sm" id="bRe">Mở lại</button>`; $('#bRe').onclick = async () => { if (await h.requestPermission({ mode: 'readwrite' }) === 'granted') loadFromHandle(h); }; return true; } await loadFromHandle(h); return true; } catch { return false; } }

/* ---------- Chỉ mục: liên kết, backlink, thẻ ---------- */
const byName = new Map(); const links = new Map(); const back = new Map(); const tagIdx = new Map();
function parseFm(b) { if (!b.startsWith('---\n')) return { fm: {}, content: b, keys: [] }; const e = b.indexOf('\n---', 4); if (e < 0) return { fm: {}, content: b, keys: [] }; const fm = {}, keys = []; b.slice(4, e).split('\n').forEach(l => { const m = l.match(/^([\w-]+):\s*(.*)$/); if (m) { fm[m[1]] = m[2].trim().replace(/^["'\[]|["'\]]$/g, ''); keys.push(m[1]); } }); return { fm, content: b.slice(e + 4).replace(/^\r?\n/, ''), keys }; }
const stripCode = s => s.replace(/```[\s\S]*?```/g, '').replace(/`[^`]*`/g, '');
const TAG_RE = /(^|[\s(])#(?![0-9]+(?=[\s.,;)]|$))([\p{L}\p{N}_\/-]+)/gu;
function resolve(t) { t = t.trim().replace(/\.md$/i, ''); const k = t.toLowerCase(); if (V.files.has(t)) return t; if (V.files.has(t + '.md')) return t + '.md'; const base = k.split('/').pop(); const c = byName.get(base); if (!c) return null; if (c.length === 1 || !t.includes('/')) return c[0]; return c.find(p => p.toLowerCase().endsWith(k + '.md')) || c[0]; }
function fileLinks(f) { const s = new Set(); for (const m of stripCode(f.body).matchAll(/!?\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g)) s.add(m[1].trim()); return [...s]; }
function fileTags(f) { const { fm, content } = parseFm(f.body); const s = new Set(); (fm.tags || fm.tag || '').split(/[,\s]+/).filter(Boolean).forEach(t => s.add(t.replace(/^#/, ''))); for (const m of stripCode(content).matchAll(TAG_RE)) s.add(m[2]); return [...s]; }
function index() {

  cv.onpointermove = e => { if (G.drag) { const p = pt(e); G.drag.x = p.x; G.drag.y = p.y; G.drag.vx = G.drag.vy = 0; moved = true; G.alpha = Math.max(G.alpha, 0.3); } else if (pan) { G.ox = e.clientX - pan.x; G.oy = e.clientY - pan.y; moved = true; } else { G.hover = hit(e); cv.style.cursor = G.hover ? 'pointer' : 'grab'; } };
  cv.onpointerup = e => { if (G.drag && !moved) { const n = G.drag; if (n.file) open(n.file.path); else if (n.tag) { G.q = n.label; $('#gq').value = n.label; } } G.drag = null; pan = null; };
  cv.onwheel = e => { e.preventDefault(); const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top; const z = Math.max(0.15, Math.min(4, G.zoom * (e.deltaY < 0 ? 1.1 : 0.9))); G.ox = mx - (mx - G.ox) * z / G.zoom; G.oy = my - (my - G.oy) * z / G.zoom; G.zoom = z; };
  function fit(force) { if (!G.nodes.length) return; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const n of G.nodes) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); } const pad = 60; G.zoom = Math.max(0.15, Math.min(2, Math.min(W() / (x1 - x0 + pad * 2), H() / (y1 - y0 + pad * 2)))); G.ox = W() / 2 - (x0 + x1) / 2 * G.zoom; G.oy = H() / 2 - (y0 + y1) / 2 * G.zoom; }
  window.fit = fit;
}
/* ---------- Sơ đồ cục bộ (ghi chú hiện tại + láng giềng 2 bậc) ---------- */
let LG = null;
function localGraph(cv, path) {
  if (!cv) return; if (LG) cancelAnimationFrame(LG.raf); const ctx = cv.getContext('2d'); const r = devicePixelRatio || 1; const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * r; cv.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0);
  const nb = p => [...(links.get(p) || []), ...(back.get(p) || [])]; const l1 = new Set(nb(path)); const l2 = new Set(); for (const p of l1) nb(p).forEach(q => { if (q !== path && !l1.has(q)) l2.add(q); });
  const ids = [path, ...l1, ...[...l2].slice(0, 20)]; const nodes = ids.map((id, i) => ({ id, label: V.files.get(id).name, x: W / 2 + (i ? Math.cos(i) * 60 : 0), y: H / 2 + (i ? Math.sin(i) * 60 : 0), vx: 0, vy: 0, ring: i === 0 ? 0 : l1.has(id) ? 1 : 2, color: colorOf(V.files.get(id)) })); const byId = new Map(nodes.map(n => [n.id, n]));
  const edges = []; for (const n of nodes) for (const q of links.get(n.id) || []) { const b = byId.get(q); if (b) edges.push([n, b]); }
  let t = 0; const dark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  const loop = () => { if (t++ < 220) { for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) { const a = nodes[i], b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 1; const f = Math.min(900 / d2, 12); a.vx += dx * f * .01; a.vy += dy * f * .01; b.vx -= dx * f * .01; b.vy -= dy * f * .01; } for (const [a, b] of edges) { const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) + .01, f = (d - 55) * .04; a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f; } for (const n of nodes) { if (n.ring === 0) { n.x = W / 2; n.y = H / 2; continue; } n.vx += (W / 2 - n.x) * .01; n.vy += (H / 2 - n.y) * .01; n.x += n.vx; n.y += n.vy; n.vx *= .6; n.vy *= .6; n.x = Math.max(10, Math.min(W - 10, n.x)); n.y = Math.max(10, Math.min(H - 14, n.y)); } }
    ctx.clearRect(0, 0, W, H); const dk = dark(); ctx.strokeStyle = dk ? 'rgba(158,166,255,.3)' : 'rgba(26,31,122,.22)'; ctx.lineWidth = 1; for (const [a, b] of edges) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    ctx.font = `10.5px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const n of nodes) { const rr = n.ring === 0 ? 7 : n.ring === 1 ? 5 : 3.5; ctx.globalAlpha = n.ring === 2 ? .55 : 1; ctx.beginPath(); ctx.arc(n.x, n.y, rr, 0, Math.PI * 2); ctx.fillStyle = n.color; ctx.fill(); if (n.ring === 0) { ctx.strokeStyle = '#f9b508'; ctx.lineWidth = 2.5; ctx.stroke(); } if (n.ring < 2 || nodes.length < 12) { ctx.fillStyle = dk ? '#eef0fa' : '#12142b'; ctx.fillText(n.label.length > 22 ? n.label.slice(0, 21) + '…' : n.label, n.x, n.y + rr + 2); } }
    ctx.globalAlpha = 1; LG.raf = requestAnimationFrame(loop); };
  LG = { raf: 0, nodes }; loop();
  cv.onclick = e => { const b = cv.getBoundingClientRect(); const x = e.clientX - b.left, y = e.clientY - b.top; const n = nodes.find(n => Math.hypot(n.x - x, n.y - y) < 10); if (n && n.id !== path) open(n.id); };
}

/* ---------- Tìm nhanh ---------- */
const P = { items: [], i: 0 };
function openPal() { $('#palOv').classList.add('show'); const i = $('#palIn'); i.value = ''; i.focus(); palSearch(); }
function palSearch() { const q = $('#palIn').value.trim().toLowerCase(); const fs = [...V.files.values()]; const sc = fs.map(f => { const t = f.name.toLowerCase(); let s = 0; if (!q) s = 1; else if (t === q) s = 100; else if (t.startsWith(q)) s = 60; else if (t.includes(q)) s = 40; else if (f.path.toLowerCase().includes(q)) s = 25; else if (f.body.toLowerCase().includes(q)) s = 10; return { f, s }; }).filter(x => x.s > 0).sort((a, b) => b.s - a.s || a.f.name.localeCompare(b.f.name, 'vi')).slice(0, 14);
  P.items = sc.map(({ f }) => { let snip = f.dir; if (q) { const i = f.body.toLowerCase().indexOf(q); if (i >= 0) snip = '…' + f.body.slice(Math.max(0, i - 30), i + 60).replace(/\n/g, ' ') + '…'; } return { f, snip }; }); P.i = 0;
  $('#palRes').innerHTML = P.items.map((it, i) => `<div class="it ${i === 0 ? 'on' : ''}" data-i="${i}"><div style="min-width:0"><b>${esc(it.f.name)}</b><small>${esc(it.snip)}</small></div></div>`).join('') || '<div class="hint" style="padding:12px">Không có kết quả.</div>'; }
function palRun(i) { const it = P.items[i]; if (!it) return; $('#palOv').classList.remove('show'); open(it.f.path); }

/* ---------- Vault mẫu ---------- */
function loadSample() {
  V.files.clear(); V.assets.clear(); V.name = 'ABM — vault mẫu'; V.writable = false; V.dirHandle = null;
  const S = {
    '00 Bắt đầu tại đây.md': `---\ntags: huong-dan\n---\n# Bắt đầu tại đây\n\nĐây là **trình xem vault .md trên web**: mở thư mục ghi chú của Sếp (vault Obsidian hoặc bất kỳ thư mục .md nào), đọc ngay, không cài đặt, file không rời khỏi máy.\n\n## Có gì\n- Liên kết hai chiều \`[[ ]]\`: xem [[Brain First – A.I Second]] và bảng **Liên kết ngược** ở cột phải.\n- **Sơ đồ liên kết** động toàn vault (nút trên thanh trên) và **sơ đồ cục bộ** của ghi chú đang mở.\n- Cây thư mục, tìm nhanh **Ctrl K**, thẻ #huong-dan, dàn ý, nhúng ghi chú ![[Tam Giác Sức Mạnh A.I]].\n- Mở bằng Chrome / Edge trên máy tính: sửa và **lưu thẳng vào file** (Ctrl S), tạo ghi chú mới.\n\n## Thử\n1. Bấm **Sơ đồ liên kết**, kéo một nút, lăn chuột để phóng, bấm nút để mở.\n2. Mở [[Khung/08 Yếu tố triển khai A.I]] rồi nhìn sơ đồ cục bộ ở cột phải.\n3. Bấm **Mở thư mục** và chọn vault thật của Sếp.\n`,
    'Brain First – A.I Second.md': `# Brain First – A.I Second\n\nTriết lý trung tâm của ABM: **tư duy, bài toán và con người đi trước; A.I là công cụ khuếch đại**.\n\nMọi triển khai bắt đầu từ [[Khung/08 Yếu tố triển khai A.I]] và dựa trên [[Khung/Tam Giác Sức Mạnh A.I]]. Xem thêm [[Second Brain]] và [[Digital Workforce]].\n\n#triet-ly`,
    'Second Brain.md': `# Second Brain — Não bộ thứ hai\n\nNơi lưu và truy xuất tri thức của lãnh đạo: ghi chú, quyết định, bài học. Nguyên tắc: ghi trước, liên kết sau, rà soát định kỳ.\n\n- Công cụ: Obsidian hoặc trình xem này — cùng một thư mục .md.\n- Nuôi bằng: [[Nhật ký/2026-10-27]], [[Nhật ký/2026-10-28]].\n- Liên quan: [[Brain First – A.I Second]], [[Digital Workforce]].\n\n#second-brain`,
    'Digital Workforce.md': `# Digital Workforce — Nhân sự số\n\nĐội ngũ vai A.I làm việc cùng con người, có điểm duyệt rõ ràng. Mỗi vai có hợp đồng giao việc 8 trường.\n\nDựa trên [[Khung/08 Yếu tố triển khai A.I]]. Tri thức cho vai số lấy từ [[Second Brain]].\n\n#digital-workforce`,
    'Khung/08 Yếu tố triển khai A.I.md': `# 08 Yếu tố triển khai A.I\n\nBài toán · Dữ liệu · Công cụ/Model · Skill · Workflow · Output · Tương tác · Con người/Văn hóa.\n\n| Yếu tố | Câu hỏi then chốt |\n|---|---|\n| Bài toán | Đang giải việc gì, đo bằng gì? |\n| Dữ liệu | Nguồn nào, sạch chưa, ai sở hữu? |\n| Công cụ/Model | Dùng gì, vì sao? |\n| Skill | Cách làm đã đóng gói chưa? |\n| Workflow | Bước nào, ai duyệt? |\n| Output | Đầu ra dùng được ngay không? |\n| Tương tác | Người và A.I gặp nhau ở đâu? |\n| Con người/Văn hóa | Ai vận hành sau chuyển giao? |\n\nLiên quan: [[Tam Giác Sức Mạnh A.I]] · [[Brain First – A.I Second]] #framework`,
    'Khung/Tam Giác Sức Mạnh A.I.md': `# Tam Giác Sức Mạnh A.I\n\nLõi trung tâm: **Tư duy con người**. Ba đỉnh: **Kiến thức nền tảng · Thành thạo công cụ · Quy trình tối ưu**.\n\nXem [[08 Yếu tố triển khai A.I]]. #framework`,
    'Khung/SOP – Rà soát tuần.md': `# SOP – Rà soát tuần\n\n1. Mở [[Second Brain]], đọc nhật ký tuần.\n2. Rút 3 ưu tiên.\n3. Giao việc cho [[Digital Workforce]].\n\n- [ ] Việc mẫu chưa xong\n- [x] Việc mẫu đã xong\n\n#sop`,
    'Nhật ký/2026-10-27.md': `# 2026-10-27\n\n- Họp về nền tảng xem vault. Kết luận: giữ đơn giản, xem [[Second Brain]].\n- Ý tưởng: thay [[Khung/SOP – Rà soát tuần]] bằng bản ngắn hơn.\n\n#nhat-ky`,
    'Nhật ký/2026-10-28.md': `# 2026-10-28\n\n- Đọc lại [[Brain First – A.I Second]].\n- Ghi chú chưa liên kết tới ai: [[Ghi chú mồ côi]].\n\n#nhat-ky`,
    'Ghi chú mồ côi.md': `# Ghi chú mồ côi\n\nGhi chú này không trỏ tới ai; chỉ có một liên kết ngược từ nhật ký. Trong sơ đồ, nút nhỏ và ít kết nối.`,
  };
  for (const [p, b] of Object.entries(S)) addFile(p, b);
  finishLoad();
}

/* ---------- Sự kiện ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-wl],[data-tag],[data-dir],[data-mode],[data-hd],[data-embed],.it');
  if (!t) return;
  if (t.dataset.open) { e.preventDefault(); open(t.dataset.open); }
  else if (t.dataset.wl != null) { e.preventDefault(); const p = resolve(t.dataset.wl); if (p) open(p, t.dataset.h); else toast('Chưa có file "' + t.dataset.wl + '"'); }
  else if (t.dataset.embed) { const p = resolve(t.dataset.embed); if (p) open(p); }
  else if (t.dataset.tag) { e.preventDefault(); V.view = 'graph'; G.tags = true; G.q = '#' + t.dataset.tag; render(); }
  else if (t.dataset.dir != null) t.classList.toggle('c');
  else if (t.dataset.mode) { V.mode = t.dataset.mode; renderMain(); }
  else if (t.dataset.hd) { const h = $$('.doc h1,.doc h2,.doc h3').find(x => x.textContent === t.dataset.hd); h?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (t.classList.contains('it')) palRun(+t.dataset.i);
  if (e.target.id === 'bSave') save(); if (e.target.id === 'bLocal') $('#rp').classList.toggle('open'); if (e.target.id === 'bDl') { const f = V.files.get(V.cur); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([f.body], { type: 'text/markdown' })); a.download = f.name + '.md'; a.click(); }
});
$('#bOpen').onclick = pickDir; $('#bSample').onclick = loadSample; $('#bNew').onclick = newNote;
$('#fileDir').onchange = e => loadFromFileList([...e.target.files]);
$('#bSearch').onclick = openPal; $('#bGraph').onclick = () => { V.view = V.view === 'graph' ? 'note' : 'graph'; render(); };
$('#bTheme').onclick = () => { const r = document.documentElement; const dk = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dk ? 'light' : 'dark'; localStorage.setItem('abm-vault-theme', r.dataset.theme); };
$('#bRp').onclick = () => $('#rp').classList.toggle('open'); $('#burger').onclick = () => $('#sb').classList.toggle('open');
$('#filter').oninput = e => { V.filter = e.target.value; renderTree(); };
$('#palIn').oninput = palSearch; $('#palIn').onkeydown = e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); P.i = (P.i + (e.key === 'ArrowDown' ? 1 : -1) + P.items.length) % P.items.length; $$('#palRes .it').forEach((el, i) => el.classList.toggle('on', i === P.i)); } if (e.key === 'Enter') palRun(P.i); if (e.key === 'Escape') $('#palOv').classList.remove('show'); };
$('#palOv').onclick = e => { if (e.target === e.currentTarget) $('#palOv').classList.remove('show'); };
document.addEventListener('keydown', e => { const mod = e.ctrlKey || e.metaKey; if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); } else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } else if (mod && e.key.toLowerCase() === 'g') { e.preventDefault(); $('#bGraph').click(); } else if (e.key === 'Escape') { $('#palOv').classList.remove('show'); if (V.view === 'graph') { V.view = 'note'; render(); } } });
window.addEventListener('beforeunload', e => { if (V.dirty) { e.preventDefault(); e.returnValue = ''; } });
(() => { const t = localStorage.getItem('abm-vault-theme'); if (t) document.documentElement.dataset.theme = t; })();
(async () => { render(); if (!(await reopenLast())) loadSample(); })();
</script>
